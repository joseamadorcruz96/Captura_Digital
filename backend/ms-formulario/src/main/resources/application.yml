server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-formulario
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

jwt:
  secret: ${JWT_SECRET:captura-digital-dev-secret-key-2026-min-32-bytes}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
