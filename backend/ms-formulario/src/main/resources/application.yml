server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-formulario
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

security:
  app-key: ${APP_SECURITY_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
